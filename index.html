</html>
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RubUp - Коровка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #161926;
            --card-border: #23273c;
            --accent-purple: #6c5ce7;
            --accent-green: #2ed573;
            --accent-red: #ff4757;
            --text-main: #ffffff;
            --text-sub: #8e94a5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-wrapper {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 850px;
            background: #121420;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.7);
        }

        /* Шапка */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #181b2a;
            border-bottom: 1px solid var(--card-border);
        }

        .logo {
            font-size: 20px;
            font-weight: 900;
            background: linear-gradient(45deg, #fff, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .balance-container {
            display: flex;
            align-items: center;
            background: #0a0b12;
            border-radius: 18px;
            padding: 4px 6px 4px 12px;
            border: 1px solid var(--card-border);
        }

        .balance-amount {
            font-weight: 800;
            font-size: 14px;
            margin-right: 8px;
            color: var(--accent-green);
        }

        .btn-topup {
            background: var(--accent-purple);
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
        }

        /* Контент игры */
        .game-content {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        .back-link {
            font-size: 13px;
            color: var(--text-sub);
            cursor: pointer;
            width: fit-content;
        }

        /* Полосы дороги (снизу вверх) */
        .lanes-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .lane-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .lane-card.active {
            border-color: var(--accent-green);
            background: #152920;
            box-shadow: 0 0 12px rgba(46, 213, 115, 0.15);
        }

        .lane-card.crashed {
            border-color: var(--accent-red);
            background: #2b1419;
        }

        .lane-title {
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lane-mult {
            background: #1f2336;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 800;
            color: #a29bfe;
        }

        .lane-card.active .lane-mult {
            background: #1e3b2e;
            color: var(--accent-green);
        }

        /* Панель управления */
        .controls-panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: auto;
        }

        .diff-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .diff-btn {
            background: #0f111a;
            border: 1px solid var(--card-border);
            color: var(--text-sub);
            padding: 8px 0;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }

        .diff-btn.active {
            background: var(--accent-purple);
            color: white;
            border-color: #8c7ae6;
        }

        .bet-box {
            display: flex;
            align-items: center;
            background: #0d0f17;
            border-radius: 10px;
            padding: 4px 8px;
            border: 1px solid var(--card-border);
        }

        .bet-input {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            font-size: 15px;
            font-weight: 700;
            outline: none;
            padding: 4px;
        }

        .btn-mod {
            background: #202436;
            border: none;
            color: var(--text-sub);
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            margin-left: 4px;
            cursor: pointer;
        }

        .btn-action {
            background: linear-gradient(135deg, #6c5ce7, #8c7ae6);
            border: none;
            color: white;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
        }

        .btn-action.take {
            background: linear-gradient(135deg, #2ed573, #26af5f);
            box-shadow: 0 4px 15px rgba(46, 213, 115, 0.3);
        }

        /* Модалка */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 50;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-card {
            background: #181b29;
            border: 1px solid #2d3248;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            width: 100%;
            max-width: 320px;
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <!-- Шапка -->
        <header>
            <div class="logo">RubUp</div>
            <div class="balance-container">
                <span class="balance-amount" id="balanceVal">990 ₽</span>
                <button class="btn-topup" onclick="showTopup()">+ Пополнить</button>
            </div>
        </header>

        <!-- Основной экран игры -->
        <div class="game-content">
            <div class="back-link" onclick="alert('Вы в игре Коровка!')">‹ Назад в меню</div>

            <!-- Список полос (от 5 до 1 сверху вниз) -->
            <div class="lanes-list" id="lanesContainer">
                <!-- Генерируются скриптом -->
            </div>

            <!-- Панель управления -->
            <div class="controls-panel">
                <div class="diff-grid">
                    <div class="diff-btn active" id="d-easy" onclick="setDiff('easy')">Лёгкая</div>
                    <div class="diff-btn" id="d-medium" onclick="setDiff('medium')">Средняя</div>
                    <div class="diff-btn" id="d-hard" onclick="setDiff('hard')">Тяжёлая</div>
                    <div class="diff-btn" id="d-hardcore" onclick="setDiff('hardcore')">Хардкор</div>
                </div>

                <div class="bet-box">
                    <span style="color:var(--text-sub); margin-right:6px; font-weight:700;">₽</span>
                    <input type="number" id="betInput" class="bet-input" value="10" min="1">
                    <button class="btn-mod" onclick="modBet('half')">½</button>
                    <button class="btn-mod" onclick="modBet('double')">2×</button>
                    <button class="btn-mod" onclick="modBet('max')">МАКС</button>
                </div>

                <button class="btn-action" id="actionBtn" onclick="handleAction()">Начать игру</button>
            </div>
        </div>

        <!-- Модалка пополнения -->
        <div class="modal" id="topupModal">
            <div class="modal-card">
                <h3 style="margin-bottom:10px;">Демо-баланс</h3>
                <p style="font-size:13px; color:var(--text-sub); margin-bottom:16px;">Реальные деньги запрещены. Это симулятор для контроля азартных привычек.</p>
                <button class="btn-action" onclick="resetBal()">Сбросить на 1 000 ₽</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) tg.expand();

        let balance = parseInt(localStorage.getItem('rubup_bal')) ?? 990;
        let currentDiff = 'easy';
        let gameState = 'IDLE'; // IDLE, PLAYING
        let currentStep = -1; // -1 на старте, 0..4 полосы
        let currentBet = 10;

        const diffs = {
            easy:     { mults: [1.08, 1.22, 1.38, 1.57, 1.79], crash: 0.15 },
            medium:   { mults: [1.15, 1.35, 1.60, 1.95, 2.40], crash: 0.25 },
            hard:     { mults: [1.25, 1.60, 2.10, 2.80, 3.80], crash: 0.35 },
            hardcore: { mults: [1.40, 2.00, 3.10, 4.80, 7.50], crash: 0.50 }
        };

        function updateUI() {
            document.getElementById('balanceVal').innerText = balance.toLocaleString('ru-RU') + ' ₽';
            localStorage.setItem('rubup_bal', balance);
            renderLanes();
        }

        function renderLanes() {
            const container = document.getElementById('lanesContainer');
            container.innerHTML = '';
            const mults = diffs[currentDiff].mults;

            // Рендерим полосы сверху вниз (от Полосы 5 до Полосы 1)
            for (let i = 4; i >= 0; i--) {
                const isActive = (currentStep === i);
                const card = document.createElement('div');
                card.className = `lane-card ${isActive ? 'active' : ''}`;

                let titleHtml = `Полоса ${i + 1}`;
                if (isActive) {
                    titleHtml = `🐮 Полоса ${i + 1}`;
                }

                card.innerHTML = `
                    <div class="lane-title">${titleHtml}</div>
                    <div class="lane-mult">x${mults[i].toFixed(2)}</div>
                `;
                container.appendChild(card);
            }
        }

        function setDiff(d) {
            if (gameState === 'PLAYING') return;
            currentDiff = d;
            document.querySelectorAll('.diff-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(`d-${d}`).classList.add('active');
            renderLanes();
        }

        function modBet(type) {
            if (gameState === 'PLAYING') return;
            let input = document.getElementById('betInput');
            let val = parseInt(input.value) || 0;
            if (type === 'half') val = Math.max(1, Math.floor(val / 2));
            if (type === 'double') val = Math.min(balance, val * 2);
            if (type === 'max') val = balance;
            input.value = val;
        }

        function handleAction() {
            if (gameState === 'IDLE') {
                let bet = parseInt(document.getElementById('betInput').value) || 0;
                if (bet <= 0 || bet > balance) {
                    alert("Неверная ставка или недостаточно виртуальных средств!");
                    return;
                }
                balance -= bet;
                currentBet = bet;
                updateUI();

                gameState = 'PLAYING';
                currentStep = 0; // Первый шаг на полосу 1
                
                updateGameButton();
                renderLanes();
            } else {
                makeStep();
            }
        }

        function makeStep() {
            const cfg = diffs[currentDiff];

            // Проверка на столкновение с машиной
            if (Math.random() < cfg.crash) {
                alert(`🚗 Бабах! Корову сбила машина.\nПотеряно: ${currentBet} виртуальных ₽.\n\nПсихологический итог: на дистанции казино всегда забирает всё.`);
                resetGame();
                return;
            }

            currentStep++;

            if (currentStep > 4) {
                // Успешно пройдены все 5 полос!
                takeWin();
                return;
            }

            updateGameButton();
            renderLanes();
        }

        function updateGameButton() {
            const btn = document.getElementById('actionBtn');
            const mult = diffs[currentDiff].mults[currentStep];
            const currentWin = Math.floor(currentBet * mult);

            if (gameState === 'PLAYING') {
                btn.innerText = `Забрать ${currentWin} ₽ (x${mult.toFixed(2)})`;
                btn.className = "btn-action take";
                // Меняем поведение кнопки на "Забрать выигрыш"
                btn.onclick = takeWin;
            } else {
                btn.innerText = "Начать игру";
                btn.className = "btn-action";
                btn.onclick = handleAction;
            }
        }

        function takeWin() {
            if (gameState !== 'PLAYING') return;
            const mult = diffs[currentDiff].mults[currentStep];
            const win = Math.floor(currentBet * mult);
            balance += win;
            
            alert(`🎉 Победа! Вы забрали ${win} виртуальных ₽.`);
            resetGame();
        }

        function resetGame() {
            gameState = 'IDLE';
            currentStep = -1;
            const btn = document.getElementById('actionBtn');
            btn.innerText = "Начать игру";
            btn.className = "btn-action";
            btn.onclick = handleAction;
            updateUI();
        }

        function showTopup() { document.getElementById('topupModal').style.display = 'flex'; }
        function resetBal() { balance = 1000; updateUI(); document.getElementById('topupModal').style.display = 'none'; }

        updateUI();
    </script>
</body>
</html>
</html>
