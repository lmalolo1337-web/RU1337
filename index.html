</html>
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RubUp - Коровка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-dark: #0d0f17;
            --card-bg: #161926;
            --accent-purple: #6c5ce7;
            --accent-green: #2ed573;
            --accent-red: #ff4757;
            --text-white: #ffffff;
            --text-dim: #8e94a5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Ограничиваем ширину под мобильный формат */
        .app-wrapper {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 880px;
            background: #121420;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        }

        /* Шапка */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #181b2a;
            border-bottom: 1px solid #23273c;
        }

        .logo {
            font-size: 20px;
            font-weight: 900;
            background: linear-gradient(45deg, #fff, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .balance-badge {
            background: #0a0b12;
            padding: 4px 10px;
            border-radius: 16px;
            border: 1px solid #282c42;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .balance-val {
            color: var(--accent-green);
            font-weight: 800;
            font-size: 14px;
        }

        .btn-topup {
            background: var(--accent-purple);
            border: none;
            color: white;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Холст игры */
        .game-container {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1d2e;
            padding: 10px;
        }

        canvas {
            border-radius: 12px;
            background: #252a3e;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
        }

        /* Панель управления */
        .controls {
            background: #161926;
            padding: 12px;
            border-top: 1px solid #23273c;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .diff-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .diff-btn {
            background: #0f111a;
            border: 1px solid #282c42;
            color: var(--text-dim);
            padding: 8px 0;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }

        .diff-btn.active {
            background: var(--accent-purple);
            color: white;
            border-color: #8c7ae6;
        }

        .bet-box {
            display: flex;
            background: #0d0f17;
            border-radius: 10px;
            padding: 4px 8px;
            border: 1px solid #282c42;
            align-items: center;
        }

        .bet-input {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            font-size: 15px;
            font-weight: 700;
            outline: none;
        }

        .btn-mod {
            background: #202436;
            border: none;
            color: var(--text-dim);
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            margin-left: 4px;
            cursor: pointer;
        }

        .btn-main {
            background: linear-gradient(135deg, #6c5ce7, #8c7ae6);
            border: none;
            color: white;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
        }

        .btn-main.take {
            background: linear-gradient(135deg, #2ed573, #26af5f);
        }

        /* Модалка */
        .modal {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 10;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-card {
            background: #181b29;
            border: 1px solid #2d3248;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <header>
            <div class="logo">RubUp</div>
            <div class="balance-badge">
                <span class="balance-val" id="balanceVal">1 000 ₽</span>
                <button class="btn-topup" onclick="showTopup()">+ Пополнить</button>
            </div>
        </header>

        <div class="game-container">
            <!-- Графический холст для дороги, машин и коровки -->
            <canvas id="gameCanvas" width="340" height="380"></canvas>
        </div>

        <div class="controls">
            <div class="diff-grid">
                <div class="diff-btn active" id="d-easy" onclick="setDiff('easy')">Лёгкая</div>
                <div class="diff-btn" id="d-medium" onclick="setDiff('medium')">Средняя</div>
                <div class="diff-btn" id="d-hard" onclick="setDiff('hard')">Тяжёлая</div>
                <div class="diff-btn" id="d-hardcore" onclick="setDiff('hardcore')">Хардкор</div>
            </div>

            <div class="bet-box">
                <span style="color:#8e94a5; margin-right:6px; font-weight:700;">₽</span>
                <input type="number" id="betInput" class="bet-input" value="10" min="1">
                <button class="btn-mod" onclick="modBet('half')">½</button>
                <button class="btn-mod" onclick="modBet('double')">2×</button>
                <button class="btn-mod" onclick="modBet('max')">МАКС</button>
            </div>

            <button class="btn-main" id="actionBtn" onclick="handleAction()">Начать игру</button>
        </div>

        <div class="modal" id="topupModal">
            <div class="modal-card">
                <h3 style="margin-bottom:10px;">Симулятор с 0 ₽ риска</h3>
                <p style="font-size:13px; color:#8e94a5; margin-bottom:16px;">Здесь нет реальных денег. Это инструмент для снижения лудомании.</p>
                <button class="btn-main" onclick="resetBal()">Сбросить на 1 000 ₽</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) tg.expand();

        let balance = parseInt(localStorage.getItem('rubup_bal')) || 1000;
        let currentDiff = 'easy';
        let gameState = 'IDLE'; // IDLE, PLAYING
        let currentStep = -1; // -1: на старте, 0..4: полосы
        let currentBet = 10;

        const diffs = {
            easy:     { mults: [1.08, 1.22, 1.38, 1.57, 1.79], crash: 0.15 },
            medium:   { mults: [1.15, 1.35, 1.60, 1.95, 2.40], crash: 0.25 },
            hard:     { mults: [1.25, 1.60, 2.10, 2.80, 3.80], crash: 0.35 },
            hardcore: { mults: [1.40, 2.00, 3.10, 4.80, 7.50], crash: 0.50 }
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function updateUI() {
            document.getElementById('balanceVal').innerText = balance.toLocaleString('ru-RU') + ' ₽';
            localStorage.setItem('rubup_bal', balance);
        }

        // Отрисовка игрового поля (Canvas)
        function drawScene(failed = false) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Трава / обочина
            ctx.fillStyle = "#1e241e";
            ctx.fillRect(0, 0, 50, canvas.height);

            // Дорога
            ctx.fillStyle = "#282c3c";
            ctx.fillRect(50, 0, canvas.width - 50, canvas.height);

            const laneHeight = canvas.height / 5;
            const mults = diffs[currentDiff].mults;

            // Рисуем 5 полос дороги (снизу вверх)
            for (let i = 0; i < 5; i++) {
                const y = canvas.height - (i + 1) * laneHeight;

                // Разделительная линия
                ctx.strokeStyle = "#383e56";
                ctx.setLineDash([8, 6]);
                ctx.beginPath();
                ctx.moveTo(50, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();

                // Люки / Значки коэффициентов
                const isCurrent = (currentStep === i && !failed);
                const isFailed = (currentStep === i && failed);

                ctx.fillStyle = isCurrent ? "#2ed573" : (isFailed ? "#ff4757" : "#1a1d2b");
                ctx.beginPath();
                ctx.roundRect(canvas.width - 80, y + 12, 70, 30, 8);
                ctx.fill();

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 12px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(`x${mults[i].toFixed(2)}`, canvas.width - 45, y + 31);
            }

            // Рисуем коровку 🐮
            const cowY = currentStep === -1 
                ? canvas.height - 35 
                : canvas.height - (currentStep * laneHeight) - (laneHeight / 2) + 8;
            
            ctx.font = "28px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(failed ? "💥" : "🐮", 25, cowY);

            // Если машина сбила
            if (failed) {
                ctx.fillStyle = "#ff4757";
                ctx.font = "bold 16px sans-serif";
                ctx.fillText("СБИЛА МАШИНА!", canvas.width / 2 + 25, cowY);
            }
        }

        function setDiff(d) {
            if (gameState === 'PLAYING') return;
            currentDiff = d;
            document.querySelectorAll('.diff-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(`d-${d}`).classList.add('active');
            drawScene();
        }

        function modBet(type) {
            if (gameState === 'PLAYING') return;
            let input = document.getElementById('betInput');
            let val = parseInt(input.value) || 0;
            if (type === 'half') val = Math.max(1, Math.floor(val / 2));
            if (type === 'double') val = Math.min(balance, val * 2);
            if (type === 'max') val = balance;
            input.value = val;
        }

        function handleAction() {
            if (gameState === 'IDLE') {
                let bet = parseInt(document.getElementById('betInput').value) || 0;
                if (bet <= 0 || bet > balance) {
                    alert("Проверьте ставку!");
                    return;
                }
                balance -= bet;
                currentBet = bet;
                updateUI();

                gameState = 'PLAYING';
                currentStep = -1;
                drawScene();

                const btn = document.getElementById('actionBtn');
                btn.innerText = "Сделать шаг 🐮";
                btn.onclick = makeStep;
            }
        }

        function makeStep() {
            currentStep++;
            const cfg = diffs[currentDiff];

            // Шанс аварии
            if (Math.random() < cfg.crash) {
                drawScene(true);
                setTimeout(() => {
                    alert(`🚗 Авария! Потеряно ${currentBet} виртуальных ₽.\n\nПомните: на дистанции казино всегда в плюсе.`);
                    resetGame();
                }, 100);
                return;
            }

            drawScene();

            const win = Math.floor(currentBet * cfg.mults[currentStep]);
            const btn = document.getElementById('actionBtn');
            btn.innerText = `Забрать ${win} ₽ (x${cfg.mults[currentStep].toFixed(2)})`;
            btn.className = "btn-main take";
            btn.onclick = takeWin;

            if (currentStep === 4) {
                setTimeout(takeWin, 200);
            }
        }

        function takeWin() {
            if (gameState !== 'PLAYING') return;
            const win = Math.floor(currentBet * diffs[currentDiff].mults[currentStep]);
            balance += win;
            updateUI();
            alert(`🎉 Выиграно ${win} виртуальных ₽!`);
            resetGame();
        }

        function resetGame() {
            gameState = 'IDLE';
            currentStep = -1;
            const btn = document.getElementById('actionBtn');
            btn.innerText = "Начать игру";
            btn.className = "btn-main";
            btn.onclick = handleAction;
            drawScene();
        }

        function showTopup() { document.getElementById('topupModal').style.display = 'flex'; }
        function resetBal() { balance = 1000; updateUI(); document.getElementById('topupModal').style.display = 'none'; drawScene(); }

        updateUI();
        drawScene();
    </script>
</body>
</html>
